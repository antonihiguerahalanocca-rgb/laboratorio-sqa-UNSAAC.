{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<div class="tarjeta">
  <h1>Iniciar sesión</h1>
  <p class="sub">¿No tienes cuenta? <a href="{{ url_for('registro') }}">Regístrate gratis</a></p>

  {% if registrado %}<div class="aviso ok">Cuenta creada correctamente. Ya puedes iniciar sesión.</div>{% endif %}

  <form method="post" action="{{ url_for('login') }}" novalidate>
    <div class="campo">
      <label for="correo">Correo electrónico</label>
      <input id="correo" name="correo" type="email" value="{{ correo }}" placeholder="luis.flores@gmail.com" required>
      <small class="msg" data-msg="correo"></small>
    </div>

    <div class="campo">
      <label for="password">Contraseña</label>
      <div class="con-ojo">
        <input id="password" name="password" type="password" placeholder="Tu contraseña" required>
        <button type="button" class="ojo" aria-label="Mostrar contraseña"></button>
      </div>
      {% if error %}<small class="msg error">{{ error }}</small>{% endif %}
    </div>

    <button class="boton" type="submit">Ingresar</button>
  </form>
</div>
{% endblock %}
